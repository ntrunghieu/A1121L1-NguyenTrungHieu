<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Title</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
          crossorigin="anonymous">

    <style>
        table {
            font-family: Arial, Helvetica, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

        td, th {
            border: 1px solid #ddd;
            padding: 8px;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ddd;
        }

        /*th {*/
        /*    padding-top: 12px;*/
        /*    padding-bottom: 12px;*/
        /*    text-align: left;*/
        /*    background-color: #04AA6D;*/
        /*    color: white;*/
        /*}*/

        #createForm1 .submit {

            margin-left: 30%;
            align-items: center;
        }

        #createForm1 {

            margin-top: 35px;
            margin-left: 50%;
            transform: translateX(-50%);
            width: 60%;
        }
    </style>
</head>
<body>


<h2 style="margin-top: 35px; margin-bottom: 10px; font-weight: 400;">Create Employee</h2>
<a th:href="@{/customer}">Hien thi danh sach tin tuc</a>
<p th:text="${message}"></p>
<form id="createForm1" action="/tintuc/save" th:object="${tinTuc}" method="post">
    <table>
        <tr>
            <th style="text-align: center; size: 60px" colspan="2">Chinh sua</th>
        </tr>

        <tr hidden>
            <td><label for="id">ID</label></td>
            <td>
                <input th:field="*{idTintuc}" th:value="*{idTintuc}" id="id" name="id" type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-sm">
            </td>
        </tr>
        <tr>
            <td><label for="name">Tieu de</label></td>
            <td>
                <input th:field="*{tieuDe}" th:value="*{tieuDe}" id="name" name="name" type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-sm">
                <!--                <p th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}"></p>-->
            </td>
        </tr>

        <tr>
            <td><label for="danhmuc">Danh muc</label></td>
            <td>
                <select id="danhmuc" th:field="*{danhMuc}" class="form-select" aria-label="Default select example">
                    <option value=""></option>
                    <option th:each="danhMucs :${danhMucs}" th:value="${danhMucs.idDanhMuc}" th:text="${danhMucs.tenDanhMuc}" th:checked="${danhMucs.tenDanhMuc}"></option>
                </select>
                <!--                <input th:field="*{customerGender}" th:value="*{customerGender}" type="text" id="genger" name="gender">-->
            </td>
        </tr>

        <tr>
            <td><label for="noidung">Noi dung</label></td>
            <td>
<!--                <input th:field="*{noiDung}" th:value="*{noiDung}" type="text" id="noidung" name="noidung">-->
                <textarea cols="43" ; rows="5" th:field="*{noiDung}" th:value="*{noiDung}" type="text" id="noidung" name="noidung"></textarea>

            </td>
        </tr>
        <tr>
            <td><label for="ngayDangtin">Ngay dang</label></td>
            <td><input th:field="*{ngayDangtin}" th:value="*{ngayDangtin}" type="date" id="ngayDangtin" name="ngayDangtin"></td>
        </tr>

        <tr>
            <td><label for="tenPhongVien">Phong vien</label></td>
            <td><input th:field="*{tenPhongVien}" th:value="*{tenPhongVien}" type="text" id="tenPhongVien" name="tenPhongVien"></td>
        </tr>
    </table>
    <div class="submit">
        <button type="submit">Luu</button>
        <button type="button"><a href="/tintuc">Quay lai</a></button>
    </div>
</form>




<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
</body>
</html>


</body>
