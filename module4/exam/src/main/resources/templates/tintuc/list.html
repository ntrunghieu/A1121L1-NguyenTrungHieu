    <script type="text/javascript">
        //Phuong thuc delete dung ajax
        $(document).ready(function () {
            //sư kiện nào thực hiện Ajax
            $(document).on("click", ".delete-customer", function (event) {
                //lay du lieu
                // let a = $(this);
                // let customerId = a.attr("href");
                let input = $("#idMove").val();
                // goi ajax
                $.ajax({
                    type: "DELETE",
                    //tên API
                    url: `/api/delete/${input}`,
                    //xử lý khi thành công
                    success: function (data) {
                        a.parent().parent().remove();
                    }

                });
                //chặn sự kiện mặc định của thẻ
                event.preventDefault();
            })

        })

        function searchCustomer() {
            let input = $("#input-search").val();
            $.ajax({
                type: "GET",
                url: `/tintuc/search/${input}`,
                success: function (data) {
                    let content = "<tr>\n" +
                        "                            <th>Ma tin tuc</th>\n" +
                        "                            <th>Tieu de</th>\n" +
                        "                            <th>Danh muc</th>\n" +
                        "                            <th>Ngay dang tin</th>\n" +
                        "                            <th>Noi dung</th>\n" +
                        "                            <th>Phong vien</th>\n" +
                        "                            <th>Xoa</th>\n" +
                        "                            <th>Chinh sua</th>\n" +
                        "                            <th>Xem</th>\n" +
                        "                        </tr>";
                    for (let i = 0; i < data.length; i++) {
                        content += getData(data[i]);
                    }
                    document.getElementById("tableCus").innerHTML = content;
                }
            });
            event.preventDefault();
        }

        function getData(c) {
            return `<tr>` +
                `<td>${c.idTintuc}</td>` +
                `<td>${c.tieuDe}</td>` +
                `<td>${c.danhMuc.tenDanhMuc}</td>` +
                // `<td>${dates.format(c.ngayDangtin, 'dd-MM-yyyy')}</td>` +
                `<td>${c.ngayDangtin}</td>` +
                `<td>${c.noiDung}</td>` +
                // `<td>${c.customerGender}</td>` +

                `<td>${c.tenPhongVien}</td>` +

                `<td>
                     <button  type="button" class="btn btn-danger" data-toggle="modal" data-target="#exampleModal"
                        th:attr="onclick=|deleteModal('${c.idTintuc}', '${c.tieuDe}')|">
                        Xoa
                    </button>
                </td>` +
                `<td>
                    <button type="button" class="btn btn-danger">
                        <a th:href="@{/tintuc/update/{id}(id=${c.idTintuc})}">Chinh sua</a>
                    </button>

                </td>` +
                `<td hidden>
                     <button  type="button" class="btn btn-danger"  data-toggle="modal" data-target="#exampleModal1"
                     th:attr="onclick=|viewModal( '${t.tieuDe}','${t.danhMuc.tenDanhMuc}',
                     '${t.ngayDangtin}','${t.noiDung}', '${t.tenPhongVien}')|">
                Xem
            </button>
                </td>`+
                    `</tr>`;
        }


    </script>

<table id="tableCus" class="table table-area" style="width: 80%;">
    <thead>
    <tr>
        <th  scope="col">STT</th>
        <th scope="col">Ma tin tuc</th>
        <th>Tieu de</th>
        <th>Danh muc</th>
        <th>Ngay dang tin</th>
        <th>Noi dung</th>
        <th>Phong vien</th>
        <th>Xoa</th>
        <th>Chinh sua</th>
        <th>Xem</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="t, stt : ${tinTucs}">
        <th scope="row" th:text="${stt.count}"></th>
        <td th:text="${t.idTintuc}"></td>
        <td th:text="${t.tieuDe}"></td>
        <td th:text="${t.danhMuc.tenDanhMuc}"></td>
        <td th:text="${#dates.format(t.ngayDangtin, 'dd-MM-yyyy')}" ></td>
        <td th:text="${t.noiDung}"></td>
        <td th:text="${t.tenPhongVien}"></td>
        <td>
            <button hidden type="button" class="btn btn-danger ">
                <a th:href="${t.idTintuc}">Xoa</a>
            </button>

            <button  type="button" class="btn btn-danger" delete data-toggle="modal" data-target="#exampleModal"
                    th:attr="onclick=|deleteModal('${t.idTintuc}', '${t.tieuDe}')|">
                Xoa
            </button>
        </td>
        <!--        <td><a th:href="${t.idTintuc}" class="delete-customer">Xoa</a></td>-->
        <td>
            <button type="button" class="btn btn-danger">
                <a style="text-decoration: none" th:href="@{/tintuc/update/{id}(id=${t.idTintuc})}">Chinh sua</a>
            </button>
            <!--            <a th:href="@{/tintuc/update/{id}(id=${t.idTintuc})}">Chinh sua</a></td>-->
        </td>
        <td>
            <button  type="button" class="btn btn-danger"  data-toggle="modal" data-target="#exampleModal1"
                     th:attr="onclick=|viewModal( '${t.tieuDe}','${t.danhMuc.tenDanhMuc}',
                     '${#dates.format(t.ngayDangtin, 'dd-MM-yyyy')}','${t.noiDung}', '${t.tenPhongVien}')|">
                Xem
            </button>
        </td>


    </tr>

    </tbody>
</table>

<script>

        document.getElementById("idMove").value = id;

    function viewModal(tieude,danhmuc,ngay,noidung,phongvien) {


        // document.getElementById("idMove").value = id;
        document.getElementById("tieude").innerText = tieude;
        document.getElementById("danhmuc").innerText = danhmuc;

        document.getElementById("phongvien").innerText = phongvien;
