<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
            integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
            crossorigin="anonymous"></script>


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
            integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
            crossorigin="anonymous"></script>
    <style>
        table {
            border: 1px solid #000;
        }

        th, td {
            border: 1px dotted #555;
        }
    </style>
</head>
<body>
<h1>Province list</h1>
<br>
<a th:href="@{/provinces/create}"><button class="btn btn-dark">Create new province</button></a>
<table>
    <caption>Province List</caption>
    <thead>
    <tr>
        <th>STT</th>
        <th>Name</th>
        <th>Edit</th>
        <th>Delete</th>
        <th>View</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p, stt : ${provinces}">
        <td th:text="${stt.count}"></td>
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td>
            <a th:href="@{/provinces/{id}/edit(id=${p.id})}" ><button type="button" class="btn btn-primary">Edit</button></a>
        </td>
        <td>
            <a th:href="@{/provinces/{id}/delete(id=${p.id})}" ><button type="button" class="btn btn-primary">Delete</button></a>
        </td>
        <td>
            <a th:href="@{/provinces/{id}/view(id=${p.id})}" ><button type="button" class="btn btn-primary">View</button></a>
        </td>
    </tr>
    </tbody>
</table>


<div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <form th:action="@{/home/delete}" method="get">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Modal title</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="idMove" name="id">
                    Do you want to delete this song: <br>
                    Song Name:  <p id="songName" style="color: red"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary">Save changes</button>
                </div>
            </form>
        </div>
    </div>
</div>


<script>
    function deleteModal(id,songName){
        document.getElementById("idMove").value=id;
        document.getElementById("songName").innerText=songName;
    }
</script>

</body>
</html>
