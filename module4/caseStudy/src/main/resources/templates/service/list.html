    <script type="text/javascript">
        //Phuong thuc delete dung ajax
        $(document).ready(function () {
            //sư kiện nào thực hiện Ajax
            $(document).on("click", ".delete-employee", function (event) {
                //lay du lieu
                let a = $(this);
                let employeeId = a.attr("href");
                // goi ajax
                $.ajax({
                    type: "DELETE",
                    //tên API
                    url: `service/delete/${employeeId}`,
                    //xử lý khi thành công
                    success: function (data) {
                        a.parent().parent().remove();
                    }

                });
                //chặn sự kiện mặc định của thẻ
                event.preventDefault();
            })

        })
    </script>

<table id="tableStudent" class="table table-area" style="width: 30%;">
    <thead>
    <tr>
        <th scope="col">STT</th>
        <th scope="col">Id</th>
        <th>Name</th>
        <th>Area</th>
        <th>Cost</th>
        <th>Max people</th>
        <th>Standard Room</th>
        <th>Description</th>
        <th>Pool Area</th>
        <th>Number Of Floors</th>
        <th>Rent type</th>
        <th>Service type</th>
        <th>Delete</th>
        <th>Update</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="s, stt : ${services}">
        <th scope="row" th:text="${stt.count}"></th>
        <td th:text="${s.serviceId}"></td>
        <td th:text="${s.serviceName}"></td>
        <td th:text="${s.serviceArea}"></td>
        <td th:text="${s.serviceCost}"></td>
        <td th:text="${s.serviceMaxPeople}"></td>
        <td th:text="${s.standardRoom}"></td>
        <td th:text="${s.descriptionOtherConvenience}"></td>
        <td th:text="${s.poolArea}"></td>
        <td th:text="${s.numberOfFloors}"></td>
        <td th:text="${s.rentType.rentTypeName}"></td>
        <td th:text="${s.serviceType.serviceTypeName}"></td>
        <td><a th:href="${s.serviceId}" class="delete-employee">Delete</a></td>
        <td><a th:href="@{/service/update/{id}(id=${s.serviceId})}">Update</a></td>
    </tr>
    </tbody>
</table>
