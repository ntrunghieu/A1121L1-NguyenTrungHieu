<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Title</title>


    <style>
        table {
            font-family: Arial, Helvetica, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

        td, th {
            border: 1px solid #ddd;
            padding: 8px;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ddd;
        }

        /*th {*/
        /*    padding-top: 12px;*/
        /*    padding-bottom: 12px;*/
        /*    text-align: left;*/
        /*    background-color: #04AA6D;*/
        /*    color: white;*/
        /*}*/

        #createForm1 .submit {

            margin-left: 30%;
            align-items: center;
        }

        #createForm1 {

            margin-top: 35px;
            margin-left: 50%;
            transform: translateX(-50%);
            width: 60%;
        }
    </style>
</head>
<body>


<h2 style="margin-top: 35px; margin-bottom: 10px; font-weight: 400;">Create Employee</h2>
<a th:href="@{/customer}">Display List Customer</a>
<p th:text="${message}"></p>
<form id="createForm1" action="/customer/save" th:object="${customer}" method="post">
    <table>
        <tr>
            <th colspan="2">Create a new customer</th>
        </tr>

        <tr hidden>
            <td><label for="id">ID</label></td>
            <td>
                <input th:field="*{customerId}" th:value="*{customerId}" id="id" name="id" type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-sm">
            </td>
        </tr>
        <tr>
            <td><label for="name">Name</label></td>
            <td>
                <input th:field="*{customerName}" th:value="*{customerName}" id="name" name="name" type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-sm">
                <p th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}"></p>
            </td>
        </tr>
        <tr>
            <td><label for="date">Birthday</label></td>
            <td><input th:field="*{customerBirthday}" th:value="*{customerBirthday}" type="date" id="date" name="date"></td>
        </tr>
        <tr>
            <td><label for="idCard">ID Card</label></td>
            <td><input th:field="*{customerIdCard}" th:value="*{customerIdCard}" type="text" id="idCard" name="IDCard"></td>
        </tr>
        <tr>
            <td><label for="genger">Salary</label></td>
            <td>
                <select id="genger" th:field="*{customerGender}" class="form-select" aria-label="Default select example">
                    <option value="1"  th:checked="*{customerGender}">Nam</option>
                    <option value="0">Nữ</option>
                </select>
<!--                <input th:field="*{customerGender}" th:value="*{customerGender}" type="text" id="genger" name="gender">-->
            </td>
        </tr>
        <tr>
            <td><label for="type">Type</label></td>
            <td>
                <select id="type" th:field="*{customerType.customerTypeId}" class="form-select" aria-label="Default select example">
                    <option value=""></option>
                    <option th:each="customerType :${customerType}" th:value="${customerType.customerTypeId}" th:text="${customerType.customerTypeName}" th:checked="${customerType.customerTypeName}"></option>
                </select>
            </td>
        </tr>
        <tr>
            <td><label for="phone">Phone</label></td>
            <td><input th:field="*{customerPhone}" th:value="*{customerPhone}" type="text" id="phone" name="phoneNumber"></td>
        </tr>
        <tr>
            <td><label for="email">Email</label></td>
            <td><input th:field="*{customerEmail}" th:value="*{customerEmail}" type="text" id="email" name="email"></td>
        </tr>
        <tr>
            <td><label for="address">Address</label></td>
            <td><input th:field="*{customerAddress}" th:value="*{customerAddress}" type="text" id="address" name="address"></td>
        </tr>

    </table>
    <div class="submit">
        <button type="submit">Save</button>
        <button type="button"><a href="/customer">Back to list</a></button>
    </div>
</form>
</body>
</html>
