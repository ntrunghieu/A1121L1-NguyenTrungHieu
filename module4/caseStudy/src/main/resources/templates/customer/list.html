    <script type="text/javascript">
        //Phuong thuc delete dung ajax
        $(document).ready(function () {
            //sư kiện nào thực hiện Ajax
            $(document).on("click", ".delete-customer", function (event) {
                //lay du lieu
                let a = $(this);
                let customerId = a.attr("href");
                // goi ajax
                $.ajax({
                    type: "DELETE",
                    //tên API
                    url: `/api/delete/${customerId}`,
                    //xử lý khi thành công
                    success: function (data) {
                        a.parent().parent().remove();
                    }

                });
                //chặn sự kiện mặc định của thẻ
                event.preventDefault();
            })

        })

        function searchCustomer() {
            let input = $("#input-search").val();
            $.ajax({
                type: "GET",
                url: `/customer/search/${input}`,
                success: function (data) {
                    let content = "<tr>\n" +
                        "                            <th>ID</th>\n" +
                        "                            <th>Username</th>\n" +
                        "                            <th>ID Card</th>\n" +
                        "                            <th>Phone</th>\n" +
                        "                            <th>Email</th>\n" +
                        "                            <th>Gender</th>\n" +
                        "                            <th>Address</th>\n" +
                        "                            <th>Type</th>\n" +
                        "                            <th>Delete</th>\n" +
                        "                            <th>Update</th>\n" +
                        "                        </tr>";
                    for (let i = 0; i < data.length; i++) {
                        content += getData(data[i]);
                    }
                    document.getElementById("tableCus").innerHTML = content;
                }
            });
            event.preventDefault();
        }

        function getData(c) {
            return `<tr>` +
                `<td>${c.customerId}</td>` +
                `<td>${c.customerName}</td>` +
                `<td>${c.customerIdCard}</td>` +
                `<td>${c.customerPhone}</td>` +
                `<td>${c.customerEmail}</td>` +
                // `<td>${c.customerGender}</td>` +
                `<div th:switch="${c.customerGender}">
                    <td th:case="true">Nam</td>
                    <td th:case="false">Nu</td>
                </div>` +
                `<td>${c.customerAddress}</td>` +
                `<td>${c.customerType.customerTypeName}</td>` +
                `<td><a th:href="${c.customerId}" class="delete-customer">Delete</a></td>` +
                `<td><a th:href="@{/customer/update/{id}(id=${c.customerId})}" >Update</a></td>` +
                `</tr>`;
        }
    </script>

<table id="tableCus" class="table table-area" style="width: 30%;">
    <thead>
    <tr>
        <th scope="col">STT</th>
        <th scope="col">Id</th>
        <th>Username</th>
        <th>ID Card</th>
        <th>Phone</th>
        <th>Email</th>
        <th>Gender</th>
        <th>Address</th>
        <th>Type</th>
        <th>Delete</th>
        <th>Update</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c, stt : ${customers}">
        <th scope="row" th:text="${stt.count}"></th>
        <td th:text="${c.customerId}"></td>
        <td th:text="${c.customerName}"></td>
        <td th:text="${c.customerIdCard}"></td>
        <td th:text="${c.customerPhone}"></td>
        <td th:text="${c.customerEmail}"></td>
        <div th:switch="${c.customerGender}">
            <td th:case="true">Nam</td>
            <td th:case="false">Nu</td>
        </div>

        <td th:text="${c.customerAddress}"></td>
        <td th:text="${c.customerType.customerTypeName}"></td>
        <td><a th:href="${c.customerId}" class="delete-customer">Delete</a></td>
        <td><a th:href="@{/customer/update/{id}(id=${c.customerId})}">Update</a></td>
    </tr>
    </tbody>
</table>
