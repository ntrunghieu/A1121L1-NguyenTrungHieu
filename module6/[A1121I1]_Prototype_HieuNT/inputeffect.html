<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        button{
            cursor: pointer;
        }
        body{
            padding: 20px;
        }
        .form-input{
            border: 1px solid #eeeeee;
            border-radius: 4px;
            width: 100%;
            height: 50px;
            padding: 0 20px;
            transition: 0.25s ease;
            background: white;
        }
        .form-input:hover {
            border-color: #6a5af9;
        }
        .form-field{
            position: relative;
        }
        .form-label{
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 21px;
            user-select: none;
            color: #999999;
            pointer-events: none;
            transition: 0.23s ease;
        }
        .form-input:not(:placeholder-shown) + .form-label,
        .form-input:hover + .form-label{
            top: 0;
            padding: 10px;
            display: inline-block;
            background-color: white;
            color: #6a5af9;
            font-weight: 600;
        }

    </style>
</head>
<body>
<div class="form-field">
    <input id="name" type="text" class="form-input" placeholder=" ">
    <label for="name" class="form-label">Name</label>
</div>
</body>
</html>
