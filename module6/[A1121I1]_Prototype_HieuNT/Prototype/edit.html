<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="bootstrap413/css/bootstrap.css">

</head>
<div class="container">
    <h1 class="text-center text-danger">Chỉnh Sửa Thông Tin Khách Hàng</h1>
    <form>
        <div class="form-group row">
            <label class="col-sm-2 col-form-label">Ma KH</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" formControlName="id" *ngIf="id > 0" readonly disabled value="MKH-001">
            </div>
        </div>
        <div class="form-group row">
            <label class="col-sm-2 col-form-label">Họ Và Tên</label>
            <div class="col-sm-10">
                <input type="text" class="form-control">
            </div>
        </div>
        <div class="form-group row">
            <label class="col-sm-2 col-form-label">Điện Thoại</label>
            <div class="col-sm-10">
                <input type="text" class="form-control">
            </div>
        </div>
        <div class="form-group row">
            <label class="col-sm-2 col-form-label">Địa Chỉ</label>
            <div class="col-sm-10">
                <input type="text" class="form-control">
            </div>
        </div>
        <div>
            <button type="submit">Submit</button>
            <button type="button">Cancel</button>
        </div>
    </form>
</div>


<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"

        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</html>
