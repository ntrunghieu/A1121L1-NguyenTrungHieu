<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="bootstrap413/css/bootstrap.css">
    <link rel="stylesheet" href="mycss.css">

</head>
<h1  style=" color: #0f57b3;" class="text-center ">Thêm Mới Khách Hàng</h1>
<div class="container col-md-6" >
    <form class="col-md-12" style="margin-top: 10px">
        <div class="form-group row col-12" style="margin-top: 10px">
            <label class="col-lg-4 col-form-label " >Mã khách hàng <sup style="color: red">(*)</sup></label>
            <div class="col-7">
                <input type="text" class="form-control" formControlName="id" *ngIf="id > 0" readonly disabled>
            </div>
        </div>
        <div class="form-group row col-12">
            <label class="col-lg-4 col-form-label">Họ và tên <sup style="color: red">(*)</sup></label>
            <div class="col-7">
                <input type="text" class="form-control">
            </div>
        </div>
        <div class="form-group row col-12">
            <label class="col-lg-4 col-form-label">Điện Thoại <sup style="color: red">(*)</sup></label>
            <div class="col-7">
                <input type="text" class="form-control">
            </div>
        </div>
        <div class="form-group row col-12">
            <label class="col-lg-4 col-form-label">Địa Chỉ <sup style="color: red">(*)</sup></label>
            <div class="col-7">
                <input type="text" class="form-control">
            </div>
        </div>
        <div class="form-group row col-12" style="margin-left: 17%; margin-bottom: 15px;">
            <button class="btn__primary" style="margin-bottom: 10px; margin-right: 10px" type="submit">Lưu</button>
            <button class="btn__cancel" type="button">Hủy</button>
        </div>
    </form>
</div>


<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</html>
