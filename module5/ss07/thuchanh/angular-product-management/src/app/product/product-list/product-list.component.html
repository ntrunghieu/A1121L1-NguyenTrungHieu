<a class="btn btn-primary" routerLink="/product/create">Create</a>

<div class="container">
  <h3>List Product</h3>
  <table class="table">
    <tr>
      <th>#</th>
      <th>Name</th>
      <th>Price</th>
      <th>Description</th>
      <th>Update</th>
      <th>Delete</th>
    </tr>
    <tr *ngFor="let item of products; index as i">
      <td>{{i+1}}</td>
      <td>{{item.name}}</td>
      <td>{{item.price}}</td>
      <td>{{item.description}}</td>
      <td>
        <button [routerLink]="['/product/update', item.id]">Update</button>
      </td>
      <td><button [routerLink]="['/product/delete', item.id]">Delete</button></td>
    </tr>
  </table>
  <hr>
  <div>
    <button (click)="back()">Back</button>
    <span>{{page}}</span>
    <button (click)="next()">Next</button>
  </div>
</div>
