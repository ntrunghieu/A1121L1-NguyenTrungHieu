<h2 style="margin-top: 35px; margin-bottom: 10px; font-weight: 400;">Create Customer</h2>
<a href="">Display List Customer</a>
<!--<p th:text="${message}"></p>-->
<form [formGroup]="createForm"  id="createForm1" (ngSubmit)="onSubmit()"  method="post">
  <table>
    <tr>
      <th colspan="2">Create a new customer</th>
    </tr>

    <tr >
      <td><label for="id">ID</label></td>
      <td>
        <input formControlName="id"  id="id" name="id" type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-sm">
      </td>
    </tr>
    <tr>
      <td><label for="name">Name</label></td>
      <td>
        <input formControlName="name" id="name" name="name" type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-sm">
<!--        <p th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}"></p>-->
      </td>
    </tr>
    <tr>
      <td><label for="date">Birthday</label></td>
      <td><input formControlName="date"  type="date" id="date" name="date"></td>
    </tr>
    <tr>
      <td><label for="idCard">ID Card</label></td>
      <td><input formControlName="idCard"  type="text" id="idCard" name="idCard"></td>
    </tr>
    <tr>
      <td><label for="gender">Gender</label></td>
      <td>
        <select formControlName="gender" id="gender" name="gender"  class="form-select" aria-label="Default select example">
          <option value="nam">Nam</option>
          <option value="nu">Nu</option>
        </select>
      </td>
    </tr>
    <tr>
      <td><label for="type">Type</label></td>
      <td>
        <select formControlName="type" name="type" id="type"  class="form-select" aria-label="Default select example">
          <option value="Diamond" selected>Diamond</option>
          <option value="Platinium">Platinium</option>
          <option value="Gold">Gold</option>
          <option value="Silver">Silver</option>
          <option value="Member">Member</option>
        </select>
      </td>
    </tr>
    <tr>
      <td><label for="phone">Phone</label></td>
      <td><input formControlName="phone"  type="text" id="phone" name="phone"></td>
    </tr>
    <tr>
      <td><label for="email">Email</label></td>
      <td><input formControlName="email"  type="text" id="email" name="email"></td>
    </tr>
    <tr>
      <td><label for="address">Address</label></td>
      <td><input formControlName="address" type="text" id="address" name="address"></td>
    </tr>

  </table>
  <div class="submit">
    <button class="btn btn-info m-3" type="submit">Save</button>
    <a class="btn btn-info" routerLink="">Back to list</a>
  </div>
</form>
