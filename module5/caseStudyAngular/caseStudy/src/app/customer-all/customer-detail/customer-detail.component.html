
  <table>
    <tr>
      <th colspan="2">Detail customer</th>
    </tr>

    <tr >
      <td><label hidden for="id">ID</label></td>
      <td>
        <h4 id="id">{{cus.id}}</h4>
      </td>
    </tr>
    <tr>
      <td><label for="name">Name</label></td>
      <td>
        <h4 id="name">{{cus.name}}</h4>

      </td>
    </tr>
    <tr>
      <td><label for="date">Birthday</label></td>
      <td><h4 id="date">{{cus.date}}</h4>
      </td>
    </tr>
    <tr>
      <td><label for="idCard">ID Card</label></td>
      <td><h4 id="idCard">{{cus.idCard}}</h4>
      </td>
    </tr>
    <tr>
      <td><label for="gender">Gender</label></td>
      <td>
        <h4 id="gender">{{cus.gender}}</h4>

      </td>
    </tr>
    <tr>
      <td><label for="type">Type</label></td>
      <td>
        <h4 id="type">{{cus.type}}</h4>

      </td>
    </tr>
    <tr>
      <td><label for="phone">Phone</label></td>
      <td>        <h4 id="phone">{{cus.phone}}</h4>
      </td>
    </tr>
    <tr>
      <td><label for="email">Email</label></td>
      <td>        <h4 id="email">{{cus.email}}</h4>
      </td>
    </tr>
    <tr>
      <td><label for="address">Address</label></td>
      <td>        <h4 id="address">{{cus.address}}</h4>
      </td>
    </tr>

  </table>
  <div class="submit">
    <a class="btn btn-info" (click)="back()">Back to list</a>
  </div>
