<h2 style="margin-top: 35px; margin-bottom: 10px; font-weight: 400;">Create Customer</h2>
<a href="">Display List Customer</a>
<!--<p th:text="${message}"></p>-->
<form id="createForm1" action="/customer/save"  method="post">
  <table>
    <tr>
      <th colspan="2">Update customer</th>
    </tr>

    <tr hidden>
      <td><label for="id">ID</label></td>
      <td>
        <input  id="id" name="id" type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-sm">
      </td>
    </tr>
    <tr>
      <td><label for="name">Name</label></td>
      <td>
        <input  id="name" name="name" type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-sm">
<!--        <p th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}"></p>-->
      </td>
    </tr>
    <tr>
      <td><label for="date">Birthday</label></td>
      <td><input type="date" id="date" name="date"></td>
    </tr>
    <tr>
      <td><label for="idCard">ID Card</label></td>
      <td><input  type="text" id="idCard" name="IDCard"></td>
    </tr>
    <tr>
      <td><label for="gender">Gender</label></td>
      <td>
        <select id="gender"  class="form-select" aria-label="Default select example">
          <option value="nam">Nam</option>
          <option value="nu">Nu</option>

        </select>
      </td>
    </tr>
    <tr>
      <td><label for="type">Type</label></td>
      <td>
        <select id="type"  class="form-select" aria-label="Default select example">
          <option value="Diamond">Diamond</option>
          <option value="Platinium">Platinium</option>
          <option value="Gold">Gold</option>
          <option value="Silver">Silver</option>
          <option value="Member">Member</option>
        </select>
      </td>
    </tr>
    <tr>
      <td><label for="phone">Phone</label></td>
      <td><input  type="text" id="phone" name="phoneNumber"></td>
    </tr>
    <tr>
      <td><label for="email">Email</label></td>
      <td><input  type="text" id="email" name="email"></td>
    </tr>
    <tr>
      <td><label for="address">Address</label></td>
      <td><input  type="text" id="address" name="address"></td>
    </tr>

  </table>
  <div class="submit">
    <button type="submit">Save</button>
    <button type="button"><a href="/customer">Back to list</a></button>
  </div>
</form>
