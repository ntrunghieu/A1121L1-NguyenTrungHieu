<a class="btn btn-primary m-3" routerLink="create">Create</a>
<table id="tableCus" class="table table-hover" style="width: 30%;">
  <thead>
  <tr>
    <th scope="col">STT</th>
    <th scope="col">Id</th>
    <th>Username</th>
    <th>ID Card</th>
    <th>Date</th>
    <th>Phone</th>
    <th>Email</th>
    <th>Gender</th>
    <th>Address</th>
    <th>Type</th>
    <th>Action</th>

  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let cus of listCustomer; let i=index;">
    <th scope="row">{{i}}</th>
    <td>{{cus.id}}</td>
    <td>{{cus.name}}</td>
    <td>{{cus.date | date:"dd-MM-yyyy"}}</td>
    <td>{{cus.idCard}}</td>
    <td>{{cus.phone}}</td>
    <td>{{cus.email}}</td>
    <td *ngIf="cus.gender">Nam</td>
    <td *ngIf="!cus.gender">Nu</td>
    <td>{{cus.address}}</td>
    <td>{{cus.type}}</td>
    <td class="d-flex">

        <button type="button" class="btn btn-primary "  data-toggle="modal" data-target="#exam1" (click)="sendCustomerToDelete(cus.id, cus.name)" >
          Xoa
        </button>

<!--        <button hidden type="button" class="btn btn-primary"  (click)="openPopup()" >-->
<!--          Xoa-->
<!--        </button>-->
        <a class="btn btn-danger mx-3">Sua</a>
        <button routerLink="detail" type="button" class="btn btn-primary" (click)="temp= getInfor(cus)" >
          Xem
        </button>

    </td>

  </tr>
  </tbody>

</table>

<div class="modal fade" id="exam1" tabindex="-1" aria-labelledby="exampleModalLabel"
     aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Modal title</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">

        <p  class="">Ban co muon xoa: <span class="text-warning">{{customerNameToDelete}}</span> </p>
<!--        <input type="number" [(ngModel)]="cus.id" #id>-->

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" data-dismiss="modal" (click)="delete(customerIdToDelete)">Xoa</button>
      </div>
    </div>
  </div>
</div>
