<h2 style="margin-top: 35px; margin-bottom: 10px; font-weight: 400;">Update Employee</h2>
<p ></p>
<form [formGroup]="employeeForm" id="createForm1"  (ngSubmit)="onSubmit()" method="post">
  <table>
    <tr>
      <th colspan="2">Update employee</th>
    </tr>

    <tr hidden>
      <td><label for="id">ID</label></td>
      <td>
        <input [(ngModel)]="employee.name"  [value]="employee.id" formControlName="id" id="id" name="id" type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-sm">
      </td>
    </tr>
    <tr>
      <td><label for="name">Name</label></td>
      <td>
        <input [(ngModel)]="employee.name"   formControlName="name" id="name" name="name" type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-sm">
      </td>
    </tr>
    <tr>
      <td><label for="birthday">Birthday</label></td>
      <td><input [(ngModel)]="employee.birthday"   formControlName="birthday" type="date" id="birthday" name="birthday"></td>
    </tr>
    <tr>
      <td><label for="idCard">ID Card</label></td>
      <td><input [(ngModel)]="employee.idCard"  formControlName="idCard" type="text" id="idCard" name="IDCard"></td>
    </tr>
    <tr>
      <td><label for="salary">Salary</label></td>
      <td><input [(ngModel)]="employee.salary"  formControlName="salary" type="text" id="salary" name="salary"></td>
    </tr>
    <tr>
      <td><label for="phone">Phone</label></td>
      <td><input [(ngModel)]="employee.phone"  formControlName="phone" type="text" id="phone" name="phoneNumber"></td>
    </tr>
    <tr>
      <td><label for="email">Email</label></td>
      <td><input [(ngModel)]="employee.email"  formControlName="email" type="text" id="email" name="email"></td>
    </tr>
    <tr>
      <td><label for="position">Position</label></td>
      <td>
        <select [(ngModel)]="employee.position" formControlName="position" id="position" name="position" >


          <option   *ngFor="let p of positionList" [ngValue]="p"  aria-checked="true" selected>{{p.name}}</option>
        </select>
      </td>
    </tr>
    <tr>
      <td><label  for="division" >Division</label></td>
      <td>
        <select [compareWith]="" [(ngModel)]="employee.division"   formControlName="division" id="division" name="division" >


          <option   *ngFor="let d of divisionList" [ngValue]="d" aria-checked="true" selected>{{d.name}}</option>
          <!--          <option aria-checked="true">Sale-marketing</option>-->
          <!--          <option aria-checked="true">Hanh chinh</option>-->
          <!--          <option aria-checked="true">Phuc vu</option>-->
          <!--          <option aria-checked="true">Quan li</option>-->
        </select>
      </td>


    </tr>
    <tr>
      <td><label for="level">Education</label></td>
      <td>
        <select [(ngModel)]="employee.level" formControlName="level" id="level" name="level" >
          <option    *ngFor="let l of levelList" [ngValue]="l" aria-checked="true" selected>{{l.name}}</option>
          <!--          <option aria-checked="true">Trung cap</option>-->
          <!--          <option aria-checked="true">Dai Hoc</option>-->
          <!--          <option aria-checked="true">Cao Dang</option>-->
          <!--          <option aria-checked="true">Sau Dai Hoc</option>-->
        </select>
      </td>


    </tr>
  </table>
  <div class="submit mx-md-4" >
    <button class="btn btn-primary mx-3" type="submit">Save</button>
    <a class="btn btn-primary" routerLink="employee" (click)="back()">Back to list</a>
  </div>
</form>
