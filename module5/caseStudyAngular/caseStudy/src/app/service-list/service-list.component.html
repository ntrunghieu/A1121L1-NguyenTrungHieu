<div id="body">
  <div class="wrap" *ngFor="let facility of facilities | slice: 0 :page*3">
    <div class="ui-card " >
      <img  src="https://furamavietnam.com/wp-content/uploads/2018/03/Vietnam_Danang_Furama_Ocean-Suite-Feature-370x239.jpg"
            alt="...">
      <div style="margin-bottom: 250px" class="description middle">
        <a href="" class="btnHover btnHover1">Booking</a>

      </div>
<!--      <div class="description">-->
<!--        <a href="#">Booking</a>-->
<!--      </div>-->

        <h5 class="card-title">{{facility.name}}</h5>
        <p>Dien tich {{facility.area}}m<sup>2</sup></p>
      </div>
      <div  class="bnt-function" style="margin-left: 120px">

        </button>

        <a  [routerLink]="['update', facility.id]"  class=" mx-md-4">
          <i class="fa-solid fa-pen-to-square"></i>
        </a>
      </div>
    </div>
    <div  style="margin-left: 270px; z-index: -1000; ">
      <ul>
        <li> <i style="margin-bottom: 4px; " class="fa-solid fa-circle-info" ></i>
          <div class="content" style="z-index: 1; color: #fff ">

            <h5 style="text-align: center;font-size: 13px;font-weight: bolder">Thang máy riêng</h5>
            <h5 style="text-align: center;font-size: 13px;font-weight: bolder">Truy cập internet miễn phí</h5>
            <h5 style="text-align: center;font-size: 13px;font-weight: bolder">Toàn cảnh hướng biển</h5>
          </div>
        </li>
      </ul>
    </div>
  </div>
