<div class="col-md-9 col-xs-12 content-right">
  <div id="header-table">
    <h2 style="margin-top: 35px; margin-bottom: 10px; font-weight: 400;">Update Service</h2>
    <a>Display List Service</a>
  </div>
  <div id="input-form" style="width: 85%;margin: 10px">
    <form method="post">
      <div class="input-group input-group-sm mb-3">
        <span class="input-group-text">Name: </span>
        <input type="text" class="form-control" aria-label="Sizing example input"
               aria-describedby="inputGroup-sizing-sm">
      </div>
      <div class="input-group input-group-sm mb-3">
        <span class="input-group-text">Cost: </span>
        <input type="text" class="form-control" aria-label="Sizing example input"
               aria-describedby="inputGroup-sizing-sm">
      </div>
      <div class="input-group input-group-sm mb-3">
        <span class="input-group-text">Num Of Floors: </span>
        <input type="text" class="form-control" aria-label="Sizing example input"
               aria-describedby="inputGroup-sizing-sm">
      </div>
      <div class="input-group input-group-sm mb-3">
        <span class="input-group-text">Pool Area: </span>
        <input type="text" class="form-control" aria-label="Sizing example input"
               aria-describedby="inputGroup-sizing-sm">
      </div>
      <div class="input-group input-group-sm mb-3">
        <span class="input-group-text">Area</span>
        <input type="text" class="form-control" aria-label="Sizing example input"
               aria-describedby="inputGroup-sizing-sm">
      </div>
      <div class="input-group input-group-sm mb-3">
        <span class="input-group-text">Standard Room: </span>
        <input type="text" class="form-control" aria-label="Sizing example input"
               aria-describedby="inputGroup-sizing-sm">
      </div>
      <div class="input-group input-group-sm mb-3">
        <span class="input-group-text">Max People: </span>
        <input type="text" class="form-control" aria-label="Sizing example input"
               aria-describedby="inputGroup-sizing-sm">
      </div>
      <div class="input-group input-group-sm mb-3">
        <span class="input-group-text">Description: </span>
        <textarea cols="20" rows="5" type="text" class="form-control" aria-label="Sizing example input"
                  aria-describedby="inputGroup-sizing-sm">
                </textarea>
      </div>
      <div>
                            <span class="input-group input-group-sm mb-3">
                                <span class="input-group-text">Service Type</span>
                                 <select class="form-select" aria-label="Default select example">
                                    <option>villa</option>
                                     <option>house</option>
                                     <option>room</option>
                                 </select>
                            </span>
        <span class="input-group input-group-sm mb-3">
                                <span class="input-group-text">Customer Type</span>
                            <select class="form-select" aria-label="Default select example">
                                <option>GoLD</option>
                                 <option>Silver</option>
                                 <option>Member</option>
                            </select>
                </span>
      </div>
      <div style="width: 100%; margin-bottom: 10px" class="d-grid gap-2">
        <button class="btn btn-primary" type="submit">Create</button>
        <button class="btn btn-primary" type="button">Back</button>
      </div>
    </form>
  </div>
</div>
