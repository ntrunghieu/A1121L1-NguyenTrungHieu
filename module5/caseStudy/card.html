<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
          crossorigin="anonymous">
    <link rel="stylesheet" href="card.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css">

    <style>
        .badge-overlay {
            position: absolute;
            left: 0%;
            top: 0px;
            width: 80%;
            height: 80%;
            overflow: hidden;
            pointer-events: none;
            z-index: 14;
            -webkit-transition: width 1s ease, height 1s ease;
            -moz-transition: width 1s ease, height 1s ease;
            -o-transition: width 1s ease, height 1s ease;
            transition: width 0.4s ease, height 0.4s ease
        }

        /* ================== Badge CSS ========================*/
        .badge {
            margin: 0;
            padding: 0;
            color: white;
            padding: 10px 10px;
            font-size: 15px;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            line-height: normal;
            text-transform: uppercase;
            background: #ed1b24;
        }

        .badge::before, .badge::after {
            content: '';
            position: absolute;
            top: 0;
            margin: 0 -1px;
            width: 100%;
            height: 100%;
            background: inherit;
            min-width: 55px
        }

        .badge::before {
            right: 100%
        }

        .badge::after {
            left: 100%
        }

        /* ================== Badge Position CSS ========================*/
        .bottom-right {
            position: absolute;
            bottom: 0;
            right: 0;
            -ms-transform: translateX(30%) translateY(0%) rotate(-45deg);
            -webkit-transform: translateX(30%) translateY(0%) rotate(-45deg);
            transform: translateX(30%) translateY(0%) rotate(-45deg);
            -ms-transform-origin: bottom left;
            -webkit-transform-origin: bottom left;
            transform-origin: bottom left;
        }
        .badge.pink {
            background: #ee2b8b;
        }
    </style>

</head>
<body>

<div class="ui-card" style="width: 18rem;">
    <img src="https://furamavietnam.com/wp-content/uploads/2018/03/Vietnam_Danang_Furama_Ocean-Suite-Feature-370x239.jpg"
         class="card-img-top" alt="...">
    <div class="description">
        <h4>Dich vu cho thue</h4>
        <p>Dien tich 40m<sup>2</sup></p>
        <a href="#">Booking</a>
    </div>

    <div class="card-body">
        <h5 class="card-title">Card title</h5>
        <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card's
            content.</p>
        <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#exampleModal">
            Xoa
        </button>
        <button type="button" class="btn btn-primary">
            Sua
        </button>
    </div>
    <div class="badge-overlay">
        <span class="bottom-right badge pink">75% OFF</span>
    </div>
</div>

<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel" style="margin-left:35%">Thong bao</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                Ban co muon xoa?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary">Save changes</button>
            </div>
        </div>
    </div>
</div>

</body>
